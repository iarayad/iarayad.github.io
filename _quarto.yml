project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "contents/**/*.qmd"
  resources:
    - contents/slides/gyromorphs-21-09-2026/slides.html
    - google71bbe46973ffb153.html
    - publickey.asc
    - contents/slides/pintofscience-19-05-2026/slides/animations/
    - contents/slides/pintofscience-19-05-2026/slides/figures/

website:
  title: "Isidora Araya Day"
  site-url: "https://isidora.araya.day/"
  image: contents/images/profile.png
  open-graph: true
  twitter-card: true
  favicon: favicon.svg
