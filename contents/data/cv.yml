tagline: Topological phases of matter · superconductivity · quantum transport · tensor networks · open-source software
short_profile: >-
  I am a theoretical condensed matter physicist studying how topology and
  superconductivity can be used to design robust quantum devices. I combine
  analytical theory, numerical methods, and open-source software to investigate
  protected quantum transport.
profile: >-
  I am a theoretical condensed matter physicist interested in the design of quantum systems with protected transport phenomena, and understanding the mechanisms that give rise to them. My research combines analytical and numerical methods, and I am particularly interested in exploring the potential of agentic models in scientific research. Above all, I enjoy collaborating with others, and look for an environment where people are encouraged to think together.
research_contributions:
  - Developed scattering-based invariants for higher-order topological phases.
  - Developed Pymablock, an open-source algorithm and software package for effective Hamiltonians.

