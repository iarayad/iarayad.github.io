<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --canvas: #300a24;
        --bond: rgba(197, 189, 208, 0.34);
        --bond-glow: rgba(165, 214, 203, 0.12);
        --atom-light: #dceee8;
        --atom-mid: #7fb8a9;
        --atom-dark: #2f6f62;
        --electron-core: #fffbe8;
        --electron-mid: #f7c56c;
        --electron-edge: #f26f4b;
        --electron-halo: rgba(247, 197, 108, 0.14);
        --pair-link: rgba(247, 197, 108, 0.58);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
      }

      [data-composition-id="solid-superconductor"] {
        width: 100vw;
        height: 100vh;
        background: var(--canvas);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .bond {
        stroke: var(--bond);
        stroke-width: 4.5;
        stroke-linecap: round;
        opacity: 0.46;
      }

      .bond-glow {
        stroke: var(--bond-glow);
        stroke-width: 9;
        stroke-linecap: round;
        opacity: 0.32;
      }

      .atom {
        fill: url(#atomGradient);
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.2));
        animation: atomPulse 4.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .pair-link {
        stroke: var(--pair-link);
        stroke-width: 3;
        stroke-linecap: round;
        filter: drop-shadow(0 0 7px rgba(247, 197, 108, 0.55));
      }

      .electron-halo {
        fill: var(--electron-halo);
        filter: blur(0.5px);
      }

      .electron-core {
        fill: url(#electronGradient);
        filter: drop-shadow(0 0 10px rgba(247, 197, 108, 0.9));
      }

      @keyframes atomPulse {
        0%, 100% { opacity: 0.94; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .atom {
          animation-play-state: paused;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="solid-superconductor"
      data-composition-id="solid-superconductor"
      data-start="0"
      data-duration="8"
      data-width="1280"
      data-height="410"
    >
      <svg viewBox="0 0 1000 410" role="img" aria-label="Superconducting lattice with electrons moving in pairs from left to right">
        <defs>
          <radialGradient id="atomGradient" cx="34%" cy="28%" r="72%">
            <stop offset="0%" stop-color="var(--atom-light)" />
            <stop offset="44%" stop-color="var(--atom-mid)" />
            <stop offset="100%" stop-color="var(--atom-dark)" />
          </radialGradient>
          <radialGradient id="electronGradient" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="var(--electron-core)" />
            <stop offset="38%" stop-color="#ffffff" />
            <stop offset="66%" stop-color="var(--electron-mid)" />
            <stop offset="100%" stop-color="var(--electron-edge)" />
          </radialGradient>
        </defs>

        <g id="bonds"></g>
        <g id="atoms"></g>
        <g id="pairs"></g>
      </svg>
    </div>

    <script>
      (() => {
        const NS = "http://www.w3.org/2000/svg";
        const bonds = document.getElementById("bonds");
        const atoms = document.getElementById("atoms");
        const pairs = document.getElementById("pairs");

        const cols = 11;
        const rows = 6;
        const spacingX = 78;
        const spacingY = 54;
        const startX = 110;
        const startY = 70;

        const points = [];

        function make(tag, attrs = {}) {
          const el = document.createElementNS(NS, tag);
          for (const [key, value] of Object.entries(attrs)) {
            el.setAttribute(key, value);
          }
          return el;
        }

        for (let r = 0; r < rows; r += 1) {
          for (let c = 0; c < cols; c += 1) {
            const x = startX + c * spacingX + (r % 2) * 10;
            const y = startY + r * spacingY;
            if (x < 60 || x > 940 || y < 50 || y > 360) continue;
            points.push({ x, y, r, c });
          }
        }

        const pointByKey = new Map(points.map((p) => [`${p.r},${p.c}`, p]));

        for (const p of points) {
          if (p.c < cols - 1) {
            const right = pointByKey.get(`${p.r},${p.c + 1}`);
            if (right) {
              bonds.appendChild(make("line", {
                class: "bond-glow",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: right.x.toFixed(1),
                y2: right.y.toFixed(1),
              }));
              bonds.appendChild(make("line", {
                class: "bond",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: right.x.toFixed(1),
                y2: right.y.toFixed(1),
              }));
            }
          }
          if (p.r < rows - 1) {
            const down = pointByKey.get(`${p.r + 1},${p.c}`);
            if (down) {
              bonds.appendChild(make("line", {
                class: "bond-glow",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: down.x.toFixed(1),
                y2: down.y.toFixed(1),
              }));
              bonds.appendChild(make("line", {
                class: "bond",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: down.x.toFixed(1),
                y2: down.y.toFixed(1),
              }));
            }
          }
        }

        for (const p of points) {
          atoms.appendChild(make("circle", {
            class: "atom",
            cx: p.x.toFixed(1),
            cy: p.y.toFixed(1),
            r: "23",
          }));
        }

        const atomBounds = points.reduce((bounds, p) => ({
          minX: Math.min(bounds.minX, p.x),
          maxX: Math.max(bounds.maxX, p.x),
        }), { minX: Infinity, maxX: -Infinity });
        const pairMargin = 36;
        const trackMinX = atomBounds.minX + pairMargin;
        const trackWidth = atomBounds.maxX - atomBounds.minX - pairMargin * 2;

        const pairDefs = [
          { row: 0, anchor: 100, phase: 0.02, speed: 0.045 },
          { row: 1, anchor: 220, phase: 0.19, speed: 0.043 },
          { row: 2, anchor: 40, phase: 0.36, speed: 0.047 },
          { row: 3, anchor: 300, phase: 0.54, speed: 0.044 },
          { row: 4, anchor: 150, phase: 0.71, speed: 0.046 },
          { row: 5, anchor: 260, phase: 0.88, speed: 0.042 },
          { row: 1, anchor: 620, phase: 0.08, speed: 0.044 },
          { row: 4, anchor: 720, phase: 0.63, speed: 0.045 },
        ].map((def) => {
          const rowPoints = points.filter((p) => p.r === def.row);
          const nearest = rowPoints.reduce((best, p) => (
            Math.abs(p.x - def.anchor) < Math.abs(best.x - def.anchor) ? p : best
          ), rowPoints[0]);
          return { ...def, laneY: nearest.y, anchorX: nearest.x };
        });

        pairDefs.forEach((def, i) => {
          const pair = make("g", { transform: "translate(0 0)" });
          pair.appendChild(make("line", {
            class: "pair-link",
            x1: "-13",
            y1: "-5",
            x2: "13",
            y2: "5",
          }));

          const first = make("g", { transform: "translate(-13 -5)" });
          first.appendChild(make("circle", { class: "electron-halo", r: "15" }));
          first.appendChild(make("circle", { class: "electron-core", r: "7.2" }));

          const second = make("g", { transform: "translate(13 5)" });
          second.appendChild(make("circle", { class: "electron-halo", r: "15" }));
          second.appendChild(make("circle", { class: "electron-core", r: "7.2" }));

          pair.appendChild(first);
          pair.appendChild(second);
          pair.dataset.lane = String(def.laneY);
          pair.dataset.anchor = String(def.anchorX);
          pair.dataset.phase = String(def.phase + i * 0.03);
          pair.dataset.speed = String(def.speed);
          pairs.appendChild(pair);
        });

        function animate(now) {
          const t = now / 1000;
          [...pairs.children].forEach((pair, i) => {
            const laneY = Number(pair.dataset.lane);
            const anchorX = Number(pair.dataset.anchor);
            const phase = Number(pair.dataset.phase);
            const speed = Number(pair.dataset.speed);
            const cycle = (phase + t * speed) % 1;
            const offset = anchorX - trackMinX;
            const x = trackMinX + ((offset + cycle * trackWidth) % trackWidth + trackWidth) % trackWidth;
            const pairBreathing = Math.sin(t * 2.2 + phase * 10) * 0.9;
            const wiggle = Math.sin(t * 2.8 + x * 0.012 + i) * 2.2;
            const y = laneY + wiggle;
            pair.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${pairBreathing.toFixed(2)})`);
          });
          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
