<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --canvas: #300a24;
        --bond: rgba(197, 189, 208, 0.26);
        --bond-glow: rgba(165, 214, 203, 0.1);
        --atom-light: #eadfff;
        --atom-mid: #a990d3;
        --atom-dark: #5a3f83;
        --electron-core: #fffbe8;
        --electron-mid: #f7c56c;
        --electron-edge: #f26f4b;
        --electron-halo: rgba(247, 197, 108, 0.18);
        --ring: rgba(247, 197, 108, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
      }

      [data-composition-id="quantum-hall-insulator"] {
        width: 100vw;
        height: 100vh;
        background: var(--canvas);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .bond {
        stroke: var(--bond);
        stroke-width: 4.5;
        stroke-linecap: round;
        opacity: 0.42;
      }

      .bond-glow {
        stroke: var(--bond-glow);
        stroke-width: 9;
        stroke-linecap: round;
        opacity: 0.26;
      }

      .atom {
        fill: url(#atomGradient);
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.2));
        animation: atomPulse 4.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .trap-ring {
        fill: none;
        stroke: var(--ring);
        stroke-width: 2.4;
        stroke-dasharray: 5 7;
        filter: drop-shadow(0 0 6px rgba(247, 197, 108, 0.24));
      }

      .electron {
        animation: trapped 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .electron.e2 { animation-delay: -0.35s; }
      .electron.e3 { animation-delay: -0.7s; }
      .electron.e4 { animation-delay: -1.05s; }

      .electron-halo {
        fill: var(--electron-halo);
        filter: blur(0.5px);
      }

      .electron-core {
        fill: url(#electronGradient);
        filter: drop-shadow(0 0 11px rgba(247, 197, 108, 0.98));
      }

      @keyframes trapped {
        0% { transform: translate(-7px, -3px) scale(0.94); }
        22% { transform: translate(10px, 5px) scale(1.04); }
        54% { transform: translate(3px, -9px) scale(0.98); }
        78% { transform: translate(-6px, 7px) scale(1.02); }
        100% { transform: translate(-7px, -3px) scale(0.94); }
      }

      @keyframes atomPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .electron,
        .atom {
          animation-play-state: paused;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="quantum-hall-insulator"
      data-composition-id="quantum-hall-insulator"
      data-start="0"
      data-duration="8"
      data-width="1280"
      data-height="410"
    >
      <svg viewBox="0 0 1000 410" role="img" aria-label="Quantum Hall insulator with localized bulk electrons and edge currents on the top and bottom boundaries">
        <defs>
          <radialGradient id="atomGradient" cx="34%" cy="28%" r="72%">
            <stop offset="0%" stop-color="var(--atom-light)" />
            <stop offset="44%" stop-color="var(--atom-mid)" />
            <stop offset="100%" stop-color="var(--atom-dark)" />
          </radialGradient>
          <radialGradient id="electronGradient" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="var(--electron-core)" />
            <stop offset="38%" stop-color="#ffffff" />
            <stop offset="66%" stop-color="var(--electron-mid)" />
            <stop offset="100%" stop-color="var(--electron-edge)" />
          </radialGradient>
        </defs>

        <g id="bonds"></g>
        <g id="rings"></g>
        <g id="atoms"></g>
        <g id="localized-electrons"></g>
        <g id="electrons"></g>
      </svg>
    </div>

    <script>
      (() => {
        const NS = "http://www.w3.org/2000/svg";
        const bonds = document.getElementById("bonds");
        const rings = document.getElementById("rings");
        const atoms = document.getElementById("atoms");
        const localizedElectrons = document.getElementById("localized-electrons");
        const electrons = document.getElementById("electrons");

        const cols = 11;
        const rows = 6;
        const spacingX = 78;
        const spacingY = 54;
        const startX = 110;
        const startY = 70;

        const points = [];

        function make(tag, attrs = {}) {
          const el = document.createElementNS(NS, tag);
          for (const [key, value] of Object.entries(attrs)) {
            el.setAttribute(key, value);
          }
          return el;
        }

        for (let r = 0; r < rows; r += 1) {
          for (let c = 0; c < cols; c += 1) {
            const x = startX + c * spacingX + (r % 2) * 10;
            const y = startY + r * spacingY;
            if (x < 60 || x > 940 || y < 50 || y > 360) continue;
            points.push({ x, y, r, c });
          }
        }

        const pointByKey = new Map(points.map((p) => [`${p.r},${p.c}`, p]));

        for (const p of points) {
          if (p.c < cols - 1) {
            const right = pointByKey.get(`${p.r},${p.c + 1}`);
            if (right) {
              bonds.appendChild(make("line", {
                class: "bond-glow",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: right.x.toFixed(1),
                y2: right.y.toFixed(1),
              }));
              bonds.appendChild(make("line", {
                class: "bond",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: right.x.toFixed(1),
                y2: right.y.toFixed(1),
              }));
            }
          }
          if (p.r < rows - 1) {
            const down = pointByKey.get(`${p.r + 1},${p.c}`);
            if (down) {
              bonds.appendChild(make("line", {
                class: "bond-glow",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: down.x.toFixed(1),
                y2: down.y.toFixed(1),
              }));
              bonds.appendChild(make("line", {
                class: "bond",
                x1: p.x.toFixed(1),
                y1: p.y.toFixed(1),
                x2: down.x.toFixed(1),
                y2: down.y.toFixed(1),
              }));
            }
          }
        }

        for (const p of points) {
          atoms.appendChild(make("circle", {
            class: "atom",
            cx: p.x.toFixed(1),
            cy: p.y.toFixed(1),
            r: "23",
          }));
        }

        [
          [1, 2],
          [2, 7],
          [3, 4],
          [4, 8],
        ].forEach(([r, c], i) => {
          const p = pointByKey.get(`${r},${c}`);
          if (!p) return;

          rings.appendChild(make("circle", {
            class: "trap-ring",
            cx: p.x.toFixed(1),
            cy: p.y.toFixed(1),
            r: "31",
          }));

          const outer = make("g", { transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})` });
          const inner = make("g", { class: `electron e${i + 1}` });
          inner.appendChild(make("circle", { class: "electron-halo", r: "17" }));
          inner.appendChild(make("circle", { class: "electron-core", r: "7.5" }));
          outer.appendChild(inner);
          localizedElectrons.appendChild(outer);
        });

        const edgeDefs = [
          { edge: "top", direction: 1, phase: 0.00, speed: 0.078, lane: -1 },
          { edge: "top", direction: 1, phase: 0.13, speed: 0.070, lane: 0 },
          { edge: "top", direction: 1, phase: 0.27, speed: 0.082, lane: 1 },
          { edge: "top", direction: 1, phase: 0.41, speed: 0.074, lane: -1 },
          { edge: "top", direction: 1, phase: 0.56, speed: 0.079, lane: 0 },
          { edge: "top", direction: 1, phase: 0.71, speed: 0.072, lane: 1 },
          { edge: "top", direction: 1, phase: 0.86, speed: 0.081, lane: -1 },
          { edge: "bottom", direction: -1, phase: 0.04, speed: 0.077, lane: 1 },
          { edge: "bottom", direction: -1, phase: 0.18, speed: 0.071, lane: 0 },
          { edge: "bottom", direction: -1, phase: 0.32, speed: 0.080, lane: -1 },
          { edge: "bottom", direction: -1, phase: 0.47, speed: 0.073, lane: 1 },
          { edge: "bottom", direction: -1, phase: 0.61, speed: 0.078, lane: 0 },
          { edge: "bottom", direction: -1, phase: 0.75, speed: 0.070, lane: -1 },
          { edge: "bottom", direction: -1, phase: 0.90, speed: 0.082, lane: 1 },
        ];

        edgeDefs.forEach((def) => {
          const track = make("g", { transform: "translate(0 0)" });
          const halo = make("circle", { class: "electron-halo", r: "17" });
          const core = make("circle", { class: "electron-core", r: "7.8" });
          track.appendChild(halo);
          track.appendChild(core);
          track.dataset.edge = def.edge;
          track.dataset.direction = String(def.direction);
          track.dataset.phase = String(def.phase);
          track.dataset.speed = String(def.speed);
          track.dataset.lane = String(def.lane);
          electrons.appendChild(track);
        });

        function pointOnEdge(edge, u, t, phase, lane) {
          const x = 88 + u * 824;
          const bend = Math.sin(u * Math.PI * 2) * 10 + Math.sin(u * Math.PI * 4 + 0.4) * 4;
          const flutter = Math.sin(t * 5.2 + phase * 20 + u * 5) * 1.8;
          const laneOffset = lane * 9;
          if (edge === "top") {
            return { x, y: 58 + bend + flutter + laneOffset };
          }
          return { x, y: 352 - bend + flutter + laneOffset };
        }

        function animate(now) {
          const t = now / 1000;
          [...electrons.children].forEach((track) => {
            const edge = track.dataset.edge;
            const direction = Number(track.dataset.direction);
            const phase = Number(track.dataset.phase);
            const speed = Number(track.dataset.speed);
            const lane = Number(track.dataset.lane);
            const u = (phase + t * speed) % 1;
            const edgePosition = direction > 0 ? u : 1 - u;
            const point = pointOnEdge(edge, edgePosition, t, phase, lane);
            track.setAttribute("transform", `translate(${point.x.toFixed(1)} ${point.y.toFixed(1)})`);
          });
          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
