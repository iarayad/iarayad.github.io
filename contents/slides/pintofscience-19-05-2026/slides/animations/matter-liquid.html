<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --canvas: #300a24;
        --atom-light: #e8f4ff;
        --atom-mid: #7fb8d8;
        --atom-dark: #3f6f8a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
      }

      [data-composition-id="matter-liquid"] {
        width: 100vw;
        height: 100vh;
        background: var(--canvas);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .atom {
        fill: url(#atomGradient);
        animation: swirl 3.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .a2 { animation-delay: -0.4s; }
      .a3 { animation-delay: -0.8s; }
      .a4 { animation-delay: -1.2s; }
      .a5 { animation-delay: -1.6s; }
      .a6 { animation-delay: -2s; }
      .a7 { animation-delay: -2.4s; }
      .a8 { animation-delay: -2.8s; }
      .a9 { animation-delay: -3.2s; }

      @keyframes swirl {
        0%, 100% { transform: translate(-12px, 6px); }
        25% { transform: translate(8px, -10px); }
        50% { transform: translate(14px, 8px); }
        75% { transform: translate(-8px, 12px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .atom {
          animation-play-state: paused;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="matter-liquid"
      data-composition-id="matter-liquid"
      data-start="0"
      data-duration="8"
      data-width="420"
      data-height="260"
    >
      <svg viewBox="0 0 420 260" role="img" aria-label="Atoms in a liquid moving past each other while staying close">
        <defs>
          <radialGradient id="atomGradient" cx="34%" cy="28%" r="72%">
            <stop offset="0%" stop-color="var(--atom-light)" />
            <stop offset="44%" stop-color="var(--atom-mid)" />
            <stop offset="100%" stop-color="var(--atom-dark)" />
          </radialGradient>
        </defs>

        <circle class="atom a1" cx="144" cy="82" r="22"></circle>
        <circle class="atom a2" cx="210" cy="70" r="22"></circle>
        <circle class="atom a3" cx="278" cy="90" r="22"></circle>
        <circle class="atom a4" cx="116" cy="142" r="22"></circle>
        <circle class="atom a5" cx="190" cy="136" r="22"></circle>
        <circle class="atom a6" cx="260" cy="148" r="22"></circle>
        <circle class="atom a7" cx="150" cy="202" r="22"></circle>
        <circle class="atom a8" cx="224" cy="196" r="22"></circle>
        <circle class="atom a9" cx="302" cy="188" r="22"></circle>
      </svg>
    </div>
  </body>
</html>
