<script>
  // Page flow: on pages in `site-flow`, scrolling past the bottom continues to the next page and
  // pulling up past the top returns to the previous one, each with a view transition.
  (() => {
    const cues = {
      next: document.querySelector('[data-flow="next"]'),
      prev: document.querySelector('[data-flow="prev"]'),
    };
    if (!cues.next && !cues.prev) return;

    const threshold = 300;  // px of deliberate extra scrolling once at an edge
    const settle = 500;     // ms at the edge before counting, so a flick's momentum does not trigger it
    const root = document.documentElement;
    const atEdge = {
      next: () => window.innerHeight + window.scrollY >= root.scrollHeight - 2,
      prev: () => window.scrollY <= 0,
    };
    const pull = { next: 0, prev: 0 };
    const since = { next: null, prev: null };
    let leaving = false;
    let resetTimer = null;

    const setPull = (dir, value) => {
      pull[dir] = Math.max(0, Math.min(threshold, value));
      cues[dir]?.style.setProperty("--pull", pull[dir] / threshold);
    };
    const go = (dir) => {
      if (leaving) return;
      leaving = true;
      sessionStorage.setItem("view-transition-type", dir === "next" ? "forward" : "backward");
      window.location.href = cues[dir].href;
    };
    const track = () => {
      for (const dir of ["next", "prev"]) {
        if (!cues[dir]) continue;
        if (atEdge[dir]()) {
          since[dir] ??= performance.now();
        } else {
          since[dir] = null;
          setPull(dir, 0);
        }
      }
    };
    const push = (dy) => {
      if (leaving || dy === 0) return;
      const dir = dy > 0 ? "next" : "prev";
      setPull(dir === "next" ? "prev" : "next", 0);
      if (!cues[dir] || since[dir] === null || performance.now() - since[dir] < settle) return;
      setPull(dir, pull[dir] + Math.abs(dy));
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { setPull("next", 0); setPull("prev", 0); }, 700);
      if (pull[dir] >= threshold) go(dir);
    };

    window.addEventListener("scroll", track, { passive: true });
    window.addEventListener("wheel", (event) => push(event.deltaY), { passive: true });

    let touchY = null;
    window.addEventListener("touchstart", (event) => { touchY = event.touches[0].clientY; }, { passive: true });
    window.addEventListener("touchmove", (event) => {
      if (touchY === null) return;
      const y = event.touches[0].clientY;
      push((touchY - y) * 1.5);
      touchY = y;
    }, { passive: true });

    window.addEventListener("keydown", (event) => {
      if (event.target.closest("input, textarea, [contenteditable]")) return;
      if (["ArrowDown", "PageDown"].includes(event.key) || (event.key === " " && !event.shiftKey)) push(threshold / 2);
      if (["ArrowUp", "PageUp"].includes(event.key) || (event.key === " " && event.shiftKey)) push(-threshold / 2);
    });
    for (const dir of ["next", "prev"]) {
      cues[dir]?.addEventListener("click", () => {
        sessionStorage.setItem("view-transition-type", dir === "next" ? "forward" : "backward");
      });
    }
    // The browser's own pull-to-refresh would compete with pulling back to the previous page.
    if (cues.prev) root.style.overscrollBehaviorY = "contain";
    track();
  })();
</script>
