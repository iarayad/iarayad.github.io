<script>
  // Scrolling (or swiping) past the bottom of the homepage continues into the Research page.
  (() => {
    const link = document.querySelector("[data-next-page]");
    if (!link) return;
    const threshold = 300;  // px of deliberate extra scrolling once at the bottom
    const settle = 500;     // ms at the bottom before counting, so a flick's momentum does not trigger it
    let pull = 0, arrivedAt = null, resetTimer = null, leaving = false;

    const atBottom = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    const setPull = (value) => {
      pull = Math.max(0, Math.min(threshold, value));
      link.style.setProperty("--pull", pull / threshold);
    };
    const go = () => {
      if (leaving) return;
      leaving = true;
      sessionStorage.setItem("view-transition-type", "forward");
      window.location.href = link.href;
    };
    const push = (dy) => {
      if (leaving) return;
      if (dy <= 0 || !atBottom()) {
        setPull(0);
        return;
      }
      if (arrivedAt === null || performance.now() - arrivedAt < settle) return;
      setPull(pull + dy);
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => setPull(0), 700);
      if (pull >= threshold) go();
    };

    window.addEventListener("scroll", () => {
      if (atBottom()) {
        arrivedAt ??= performance.now();
      } else {
        arrivedAt = null;
        setPull(0);
      }
    }, { passive: true });
    window.addEventListener("wheel", (event) => push(event.deltaY), { passive: true });

    let touchY = null;
    window.addEventListener("touchstart", (event) => { touchY = event.touches[0].clientY; }, { passive: true });
    window.addEventListener("touchmove", (event) => {
      if (touchY === null) return;
      const y = event.touches[0].clientY;
      push((touchY - y) * 1.5);
      touchY = y;
    }, { passive: true });

    window.addEventListener("keydown", (event) => {
      if (["ArrowDown", "PageDown", " "].includes(event.key)) push(threshold / 2);
    });
    link.addEventListener("click", () => sessionStorage.setItem("view-transition-type", "forward"));
    // On tall screens the homepage may already end within the window.
    if (atBottom()) arrivedAt = performance.now();
  })();
</script>
