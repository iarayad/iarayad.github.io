[workspace]
authors = ["Isidora Araya <iarayaday@gmail.com>"]
channels = ["conda-forge"]
name = "iarayad.github.io"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
update-publications = "python scripts/update_publications.py"

[dependencies]
python = ">=3.12"
pyyaml = ">=6.0.2,<7"
# publist imports distutils, which Python 3.12+ only provides through setuptools.
setuptools = "*"

[pypi-dependencies]
publist = { git = "https://gitlab.kwant-project.org/anton-akhmerov/publist.git" }
